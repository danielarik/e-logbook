<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekapitulasi Logbook</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
</head>

<body class="bg-gray-100 min-h-screen">

    <div class="flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-slate-800 text-white min-h-screen p-4 flex flex-col">
            <h1 class="text-2xl font-bold mb-8 text-center text-primary tracking-tighter">LOGBOOK APP</h1>
            <nav class="space-y-2 flex-1">
                <a href="harian.html" class="flex items-center gap-3 p-3 hover:bg-slate-700 rounded transition-all">
                    <span>📅</span> Input Harian
                </a>

                <a href="rekap.html" class="flex items-center gap-3 p-3 hover:bg-slate-700 rounded transition-all">
                    <span>📊</span> Rekapitulasi
                </a>

                <a href="kegiatan.html" class="flex items-center gap-3 p-3 hover:bg-slate-700 rounded transition-all">
                    <span>📝</span> Input Butir Kegiatan
                </a>

                <a href="profil.html"
                    class="flex items-center gap-3 p-3 hover:bg-slate-700 rounded transition-all border-t border-slate-700 pt-5">
                    <span>👤</span> Profil Pegawai
                </a>
            </nav>

            <div class="mt-auto pt-10">
                <button onclick="logout()"
                    class="flex items-center gap-3 w-full text-left p-3 hover:bg-red-600 rounded transition-all text-red-200 hover:text-white">
                    <span>🚪</span> Keluar
                </button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-8">
            <div class="max-w-6xl mx-auto">
                <h2 class="text-2xl font-bold mb-6 text-slate-800">Rekapitulasi Kegiatan</h2>

                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6 bg-white p-6 rounded-xl shadow-sm items-end">
                    <div class="form-control">
                        <label class="label font-bold text-xs uppercase text-slate-500">Mode Rekap</label>
                        <select id="modeRekap" class="select select-bordered select-sm"
                            onchange="toggleFilterDisplay()">
                            <option value="bulan">Bulanan</option>
                            <option value="triwulan">Triwulan</option>
                            <option value="tahun">Tahunan</option>
                        </select>
                    </div>

                    <div id="filterBulan" class="form-control">
                        <label class="label font-bold text-xs uppercase text-slate-500">Pilih Bulan</label>
                        <select id="valBulan" class="select select-bordered select-sm">
                            <option value="1">Januari</option>
                            <option value="2">Februari</option>
                            <option value="3">Maret</option>
                            <option value="4">April</option>
                            <option value="5">Mei</option>
                            <option value="6">Juni</option>
                            <option value="7">Juli</option>
                            <option value="8">Agustus</option>
                            <option value="9">September</option>
                            <option value="10">Oktober</option>
                            <option value="11">November</option>
                            <option value="12">Desember</option>
                        </select>
                    </div>

                    <div id="filterTriwulan" class="form-control hidden">
                        <label class="label font-bold text-xs uppercase text-slate-500">Pilih Triwulan</label>
                        <select id="valTriwulan" class="select select-bordered select-sm">
                            <option value="1">Triwulan 1 (Jan-Mar)</option>
                            <option value="2">Triwulan 2 (Apr-Jun)</option>
                            <option value="3">Triwulan 3 (Jul-Sep)</option>
                            <option value="4">Triwulan 4 (Okt-Des)</option>
                        </select>
                    </div>

                    <div class="form-control">
                        <label class="label font-bold text-xs uppercase text-slate-500">Tahun</label>
                        <input type="number" id="valTahun" class="input input-bordered input-sm" value="2026">
                    </div>

                    <button onclick="loadRekapData()" class="btn btn-sm btn-primary">Tampilkan Data</button>
                </div>

                <div class="flex gap-2 mb-4 justify-end">
                    <button onclick="exportExcel()" class="btn btn-sm btn-outline btn-success">Download Excel</button>
                    <button onclick="exportPDF()" class="btn btn-sm btn-outline btn-error">Cetak PDF</button>
                </div>

                <div class="card bg-white shadow-md overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="table table-sm table-zebra w-full" id="tableToExport">
                            <thead>
                                <tr class="bg-slate-200 text-slate-700">
                                    <th>No</th>
                                    <th>Tanggal</th>
                                    <th>Butir Kegiatan</th>
                                    <th>No. RM</th>
                                    <th>Output</th>
                                    <th>Jumlah</th>
                                </tr>
                            </thead>
                            <tbody id="rekapBody">
                                <tr>
                                    <td colspan="6" class="text-center p-10 text-slate-400">Pilih filter dan klik
                                        Tampilkan Data</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://sbkruppczfctudqigfgo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mJLQAiQAmkouMEMWKxk75g_F1p6Z78m';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        let currentUserId = null;
        let dataRekap = [];

        async function checkUser() {
            const { data: { user } } = await _supabase.auth.getUser();
            if (!user) window.location.href = 'login.html';
            currentUserId = user.id;
        }

        function toggleFilterDisplay() {
            const mode = document.getElementById('modeRekap').value;
            document.getElementById('filterBulan').classList.toggle('hidden', mode !== 'bulan');
            document.getElementById('filterTriwulan').classList.toggle('hidden', mode !== 'triwulan');
        }

        async function loadRekapData() {
            const mode = document.getElementById('modeRekap').value;
            const tahun = document.getElementById('valTahun').value;

            let query = _supabase.from('view_logbook_rekap').select('*').eq('user_id', currentUserId).eq('tahun', tahun);

            if (mode === 'bulan') {
                query = query.eq('bulan', document.getElementById('valBulan').value);
            } else if (mode === 'triwulan') {
                query = query.eq('triwulan', document.getElementById('valTriwulan').value);
            }

            const { data, error } = await query.order('tanggal', { ascending: true });

            if (error) return alert(error.message);
            dataRekap = data;
            renderTable();
        }

        function renderTable() {
            const body = document.getElementById('rekapBody');
            body.innerHTML = dataRekap.length ? '' : '<tr><td colspan="6" class="text-center p-10">Data tidak ditemukan</td></tr>';

            dataRekap.forEach((item, index) => {
                body.innerHTML += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${item.tanggal}</td>
                        <td class="font-medium">${item.nama_kegiatan}</td>
                        <td>${item.no_rm || '-'}</td>
                        <td>${item.hasil_kerja || 'Kegiatan'}</td>
                        <td class="font-bold">${item.qty}</td>
                    </tr>
                `;
            });
        }

        // --- EXPORT FUNCTIONS ---

        function exportExcel() {
            if (!dataRekap.length) return alert("Data kosong");
            const worksheet = XLSX.utils.json_to_sheet(dataRekap.map((d, i) => ({
                No: i + 1, Tanggal: d.tanggal, Kegiatan: d.nama_kegiatan, No_RM: d.no_rm, Jumlah: d.qty
            })));
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Logbook");
            XLSX.writeFile(workbook, `Rekap_Logbook_${Date.now()}.xlsx`);
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("LAPORAN LOGBOOK HARIAN", 14, 15);
            doc.autoTable({
                startY: 20,
                head: [['No', 'Tanggal', 'Kegiatan', 'No. RM', 'Qty']],
                body: dataRekap.map((d, i) => [i + 1, d.tanggal, d.nama_kegiatan, d.no_rm, d.qty]),
            });
            doc.save(`Rekap_Logbook_${Date.now()}.pdf`);
        }

        async function logout() { await _supabase.auth.signOut(); window.location.href = 'login.html'; }

        checkUser();
    </script>
</body>

</html>
