<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Pegawai - Logbook</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-50 min-h-screen">

    <div class="flex flex-col md:flex-row">
        <aside class="w-full md:w-64 bg-slate-800 text-white min-h-screen p-4 flex flex-col">
            <h1 class="text-2xl font-bold mb-8 text-center text-primary tracking-tighter">LOGBOOK APP</h1>
            <nav class="space-y-2 flex-1 text-sm">
                <a href="harian.html" class="flex items-center gap-3 p-3 hover:bg-slate-700 rounded transition-all">
                    <span>📅</span> Input Harian
                </a>
                <a href="rekap.html" class="flex items-center gap-3 p-3 hover:bg-slate-700 rounded transition-all">
                    <span>📊</span> Rekapitulasi
                </a>
                <a href="kegiatan.html" class="flex items-center gap-3 p-3 hover:bg-slate-700 rounded transition-all">
                    <span>📝</span> Input Butir Kegiatan
                </a>
                <a href="profil.html"
                    class="flex items-center gap-3 p-3 bg-primary text-white rounded transition-all border-t border-slate-700 mt-5">
                    <span>👤</span> Profil Pegawai
                </a>
            </nav>

            <div class="mt-auto pt-10">
                <button onclick="logout()"
                    class="flex items-center gap-3 w-full text-left p-3 hover:bg-red-600 rounded transition-all text-red-200 hover:text-white">
                    <span>🚪</span> Keluar
                </button>
            </div>
        </aside>

        <main class="flex-1 p-4 md:p-8">
            <div class="max-w-4xl mx-auto">
                <h2 class="text-2xl font-bold mb-6 text-slate-800">Pengaturan Profil</h2>

                <div id="shareSection" class="alert shadow-lg mb-6 hidden bg-blue-50 border-blue-200">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        class="stroke-info shrink-0 w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <div class="flex-1">
                        <h3 class="font-bold text-blue-800">Link Akses Atasan (View Only)</h3>
                        <div class="text-[10px] md:text-xs font-mono bg-white p-2 mt-1 border rounded text-slate-600 break-all"
                            id="linkText">Memuat link...</div>
                    </div>
                    <button onclick="copyLink()" class="btn btn-sm btn-primary">Salin Link</button>
                </div>

                <form id="profileForm"
                    class="space-y-8 bg-white p-6 md:p-10 rounded-xl shadow-md border border-slate-100">

                    <section>
                        <h3
                            class="text-lg font-bold border-b-2 border-primary pb-2 mb-6 text-primary flex items-center gap-2">
                            <span>👤</span> DATA PEGAWAI (YANG DINILAI)
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                            <div class="form-control">
                                <label class="label font-medium text-slate-600">Nama Lengkap</label>
                                <input type="text" id="nama_lengkap"
                                    class="input input-bordered w-full focus:border-primary" required>
                            </div>
                            <div class="form-control">
                                <label class="label font-medium text-slate-600">NIP</label>
                                <input type="text" id="nip" class="input input-bordered w-full">
                            </div>
                            <div class="form-control">
                                <label class="label font-medium text-slate-600">Golongan</label>
                                <input type="text" id="golongan" class="input input-bordered w-full"
                                    placeholder="Contoh: III/a">
                            </div>
                            <div class="form-control">
                                <label class="label font-medium text-slate-600">Jabatan</label>
                                <input type="text" id="jabatan" class="input input-bordered w-full">
                            </div>
                            <div class="form-control">
                                <label class="label font-medium text-slate-600">Instansi</label>
                                <input type="text" id="instansi" class="input input-bordered w-full">
                            </div>
                            <div class="form-control">
                                <label class="label font-medium text-slate-600">Unit Kerja</label>
                                <input type="text" id="unit_kerja" class="input input-bordered w-full">
                            </div>
                            <div class="form-control md:col-span-2">
                                <label class="label font-medium text-slate-600">Kabupaten / Kota</label>
                                <input type="text" id="kota" class="input input-bordered w-full">
                            </div>
                        </div>
                    </section>

                    <section>
                        <h3
                            class="text-lg font-bold border-b-2 border-orange-400 pb-2 mb-6 text-orange-600 flex items-center gap-2">
                            <span>👔</span> DATA ATASAN PENILAI
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                            <div class="form-control md:col-span-2">
                                <label class="label font-medium text-slate-600">Nama Atasan</label>
                                <input type="text" id="atasan_nama"
                                    class="input input-bordered w-full border-orange-200">
                            </div>
                            <div class="form-control">
                                <label class="label font-medium text-slate-600">NIP Atasan</label>
                                <input type="text" id="atasan_nip"
                                    class="input input-bordered w-full border-orange-200">
                            </div>
                            <div class="form-control">
                                <label class="label font-medium text-slate-600">Jabatan Atasan</label>
                                <input type="text" id="atasan_jabatan"
                                    class="input input-bordered w-full border-orange-200">
                            </div>
                            <div class="form-control md:col-span-2">
                                <label class="label font-medium text-slate-600">Golongan Atasan</label>
                                <input type="text" id="atasan_golongan"
                                    class="input input-bordered w-full border-orange-200">
                            </div>
                        </div>
                    </section>

                    <div class="bg-slate-100 p-4 rounded-xl border border-slate-200 shadow-inner">
                        <label class="label cursor-pointer justify-start gap-4">
                            <input type="checkbox" id="is_public_view" class="checkbox checkbox-primary checkbox-lg">
                            <div>
                                <span class="label-text font-bold text-slate-700 block text-base">Buka Akses View
                                    Atasan</span>
                                <span class="text-xs text-slate-500 italic">Jika dicentang, atasan Anda bisa melihat
                                    laporan rekapitulasi melalui link khusus tanpa perlu login.</span>
                            </div>
                        </label>
                    </div>

                    <div class="flex justify-end pt-4">
                        <button type="submit" id="btnSave" class="btn btn-primary btn-wide text-white shadow-lg">
                            💾 Simpan Perubahan Profil
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script>
        const SUPABASE_URL = 'https://sbkruppczfctudqigfgo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mJLQAiQAmkouMEMWKxk75g_F1p6Z78m';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('profileForm');
        let currentUserId = null;

        async function loadProfile() {
            const { data: { user } } = await _supabase.auth.getUser();

            if (!user) {
                alert("Sesi berakhir, silakan login kembali.");
                window.location.href = 'login.html';
                return;
            }
            currentUserId = user.id;

            const { data, error } = await _supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();

            if (data) {
                // Pegawai
                document.getElementById('nama_lengkap').value = data.nama_lengkap || '';
                document.getElementById('nip').value = data.nip || '';
                document.getElementById('golongan').value = data.golongan || '';
                document.getElementById('jabatan').value = data.jabatan || '';
                document.getElementById('instansi').value = data.instansi || '';
                document.getElementById('unit_kerja').value = data.unit_kerja || '';
                document.getElementById('kota').value = data.kota || '';

                // Atasan
                document.getElementById('atasan_nama').value = data.atasan_nama || '';
                document.getElementById('atasan_nip').value = data.atasan_nip || '';
                document.getElementById('atasan_jabatan').value = data.atasan_jabatan || '';
                document.getElementById('atasan_golongan').value = data.atasan_golongan || '';

                // Config
                document.getElementById('is_public_view').checked = data.is_public_view || false;

                // LOGIKA LINK OTOMATIS
                const shareSection = document.getElementById('shareSection');
                if (data.is_public_view) {
                    shareSection.classList.remove('hidden');
                    // Membuat link otomatis menggunakan ID dari tabel profil
                    const publicLink = window.location.origin + '/view_atasan.html?id=' + data.id;
                    document.getElementById('linkText').innerText = publicLink;
                } else {
                    shareSection.classList.add('hidden');
                }
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnSave');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<span class="loading loading-spinner"></span> Menyimpan...';
            btn.disabled = true;

            const updates = {
                id: currentUserId,
                nama_lengkap: document.getElementById('nama_lengkap').value,
                nip: document.getElementById('nip').value,
                golongan: document.getElementById('golongan').value,
                jabatan: document.getElementById('jabatan').value,
                instansi: document.getElementById('instansi').value,
                unit_kerja: document.getElementById('unit_kerja').value,
                kota: document.getElementById('kota').value,
                atasan_nama: document.getElementById('atasan_nama').value,
                atasan_nip: document.getElementById('atasan_nip').value,
                atasan_jabatan: document.getElementById('atasan_jabatan').value,
                atasan_golongan: document.getElementById('atasan_golongan').value,
                is_public_view: document.getElementById('is_public_view').checked,
                updated_at: new Date()
            };

            const { error } = await _supabase.from('profiles').upsert(updates);

            if (error) {
                alert('Terjadi kesalahan: ' + error.message);
                btn.innerHTML = originalText;
                btn.disabled = false;
            } else {
                alert('Profil Berhasil Diperbarui!');
                // Menggunakan reload agar shareSection muncul secara instan setelah save
                location.reload();
            }
        });

        function copyLink() {
            const link = document.getElementById('linkText').innerText;
            if (link === "Memuat link...") return;

            navigator.clipboard.writeText(link).then(() => {
                alert('Link akses atasan berhasil disalin!');
            }).catch(err => {
                alert('Gagal menyalin link: ' + err);
            });
        }

        async function logout() {
            await _supabase.auth.signOut();
            window.location.href = 'login.html';
        }

        loadProfile();
    </script>
</body>

</html>
