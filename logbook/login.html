<!DOCTYPE html>
<html lang="id" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Logbook</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.7.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="card w-full max-w-md bg-white shadow-xl">
        <div class="card-body">
            <h2 class="text-3xl font-bold text-center text-primary mb-2">LOGBOOK</h2>
            <p class="text-center text-slate-500 mb-8">Silakan masuk untuk mengelola logbook Anda</p>

            <form id="loginForm" class="space-y-4">
                <div class="form-control">
                    <label class="label font-medium">Email</label>
                    <input type="email" id="email" placeholder="nama@email.com" class="input input-bordered" required>
                </div>
                <div class="form-control">
                    <label class="label font-medium">Password</label>
                    <input type="password" id="password" placeholder="••••••••" class="input input-bordered" required>
                </div>

                <div class="flex flex-col gap-2 pt-4">
                    <button type="submit" id="btnLogin" class="btn btn-primary">Masuk</button>
                    <button type="button" id="btnRegister" class="btn btn-outline btn-secondary">Daftar Akun
                        Baru</button>
                </div>
            </form>

            <div id="message" class="mt-4 text-center text-sm text-red-500 hidden"></div>
        </div>
    </div>

    <script>
        // Masukkan kredensial Supabase Anda di sini
        const SUPABASE_URL = 'https://sbkruppczfctudqigfgo.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_mJLQAiQAmkouMEMWKxk75g_F1p6Z78m';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const form = document.getElementById('loginForm');
        const msgDiv = document.getElementById('message');

        // FUNGSI LOGIN
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { error } = await _supabase.auth.signInWithPassword({ email, password });

            if (error) {
                msgDiv.innerText = "Gagal Login: " + error.message;
                msgDiv.classList.remove('hidden');
            } else {
                window.location.href = 'profil.html'; // Pindah ke profil jika sukses
            }
        });

        // FUNGSI DAFTAR (SIGN UP)
        document.getElementById('btnRegister').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (!email || !password) {
                alert("Isi email dan password untuk mendaftar");
                return;
            }

            const { error } = await _supabase.auth.signUp({ email, password });

            if (error) {
                msgDiv.innerText = "Gagal Daftar: " + error.message;
                msgDiv.classList.remove('hidden');
            } else {
                alert("Pendaftaran berhasil! Silakan cek email untuk verifikasi (jika aktif) atau langsung login.");
            }
        });
    </script>
</body>

</html>
